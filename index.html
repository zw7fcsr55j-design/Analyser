/* ============================================================================
   2. RECHENSCHICHT — reine Funktionen, keine UI, keine Seiteneffekte
   ========================================================================== */

const ERP = 0.045;                       // Marktrisikoprämie
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const isNum = (v) => typeof v === "number" && isFinite(v);

const de = (v, d = 2) =>
  isNum(v) ? v.toLocaleString("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d }) : "–";
const pct = (v, d = 1) => (isNum(v) ? `${v >= 0 ? "+" : ""}${de(v * 100, d)} %` : "–");
const pctAbs = (v, d = 1) => (isNum(v) ? `${de(v * 100, d)} %` : "–");
const money = (v, cur, d = 2) => (isNum(v) ? `${cur}${de(v, d)}` : "–");
const big = (v, cur) => {
  if (!isNum(v)) return "–";
  const a = Math.abs(v);
  if (a >= 1e6) return `${cur}${de(v / 1e6, 2)} Bio.`;
  if (a >= 1e3) return `${cur}${de(v / 1e3, 1)} Mrd.`;
  return `${cur}${de(v, 0)} Mio.`;
};

/* --- deterministische Demo-Kurshistorie (kein echter Verlauf) ------------- */
function mulberry(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function priceSeries(c, months = 60) {
  const seed = [...c.t].reduce((s, ch) => s * 31 + ch.charCodeAt(0), 7);
  const rnd = mulberry(seed);
  const mv = c.vol / Math.sqrt(12);
  const drift = Math.log(1 + clamp(c.g.eps5, -0.2, 0.45)) / 12;
  let p = 1, raw = [];
  for (let i = 0; i < months; i++) {
    const z = (rnd() + rnd() + rnd() + rnd() - 2) * 1.2;
    p *= Math.exp(drift + mv * z - (mv * mv) / 2);
    raw.push(p);
  }
  const scale = c.price / raw[raw.length - 1];
  const now = new Date();
  return raw.map((v, i) => {
    const d = new Date(now.getFullYear(), now.getMonth() - (months - 1 - i), 1);
    return {
      label: `${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getFullYear()).slice(2)}`,
      kurs: +(v * scale).toFixed(2),
    };
  });
}
const momentum = (series, m) => {
  const n = series.length;
  if (n <= m) return 0;
  return series[n - 1].kurs / series[n - 1 - m].kurs - 1;
};

/* --- Optionspreise (Black-Scholes, damit Prämien zur Vola passen) --------- */
function ncdf(x) {
  const a = [0.254829592, -0.284496736, 1.421413741, -1.453152027, 1.061405429], p = 0.3275911;
  const s = x < 0 ? -1 : 1; const z = Math.abs(x) / Math.SQRT2;
  const t = 1 / (1 + p * z);
  const y = 1 - ((((a[4] * t + a[3]) * t + a[2]) * t + a[1]) * t + a[0]) * t * Math.exp(-z * z);
  return 0.5 * (1 + s * y);
}
function bs(S, K, T, r, sig, type) {
  if (T <= 0 || sig <= 0) return Math.max(0, type === "call" ? S - K : K - S);
  const d1 = (Math.log(S / K) + (r + (sig * sig) / 2) * T) / (sig * Math.sqrt(T));
  const d2 = d1 - sig * Math.sqrt(T);
  return type === "call"
    ? S * ncdf(d1) - K * Math.exp(-r * T) * ncdf(d2)
    : K * Math.exp(-r * T) * ncdf(-d2) - S * ncdf(-d1);
}
function optionChain(c, rf) {
  const rough = c.price * 0.05;
  const steps = [0.5, 1, 2.5, 5, 10, 25, 50, 100];
  const step = steps.reduce((b, s) => (Math.abs(s - rough) < Math.abs(b - rough) ? s : b), steps[0]);
  const atm = Math.round(c.price / step) * step;
  const rnd = mulberry([...c.t].reduce((s, ch) => s * 17 + ch.charCodeAt(0), 3));
  return [30, 90].map((days) => {
    const T = days / 365;
    const rows = [-3, -2, -1, 0, 1, 2, 3].map((k) => {
      const K = atm + k * step;
      const skew = clamp((c.price / K - 1) * 0.55, -0.12, 0.18);
      const iv = clamp(c.vol * (days === 30 ? 1.08 : 1.0) + skew, 0.08, 1.6);
      const near = Math.exp(-Math.abs(k) / 2.2);
      const oi = Math.round((3000 + rnd() * 9000) * near);
      return {
        strike: K, iv,
        call: bs(c.price, K, T, rf, iv, "call"),
        put: bs(c.price, K, T, rf, iv, "put"),
        oiCall: oi, oiPut: Math.round(oi * (0.7 + rnd() * 0.8)),
      };
    });
    return { days, rows };
  });
}

/* --- Standard-Annahmen --------------------------------------------------- */
function defaultAssumptions(c) {
  const rf = c.cur === "€" ? 0.026 : 0.04;
  return {
    rf,
    wacc: round4(clamp(rf + c.beta * ERP + (c.profile === "cyclical" ? 0.01 : 0), 0.05, 0.16)),
    waccManual: false,
    g1: round4(clamp(c.g.fwd, -0.05, 0.3)),
    gT: 0.02,
    years: 10,
    term: "gordon",
    exitMult: c.hist.ev ? round4(c.hist.ev * 0.8) : 10,
    aaa: round4(rf + 0.012),
  };
}
const round4 = (v) => Math.round(v * 10000) / 10000;
const suggestedWacc = (c, rf) =>
  round4(clamp(rf + c.beta * ERP + (c.profile === "cyclical" ? 0.01 : 0), 0.03, 0.2));

/* --- Modell 1: DCF ------------------------------------------------------- */
function dcf(c, a) {
  if (!isNum(c.fcf) || !isNum(c.netDebt))
    return { ok: false, why: "Freier Cashflow bzw. Nettoverschuldung nicht sinnvoll definiert." };
  if (a.wacc <= a.gT + 0.005)
    return { ok: false, why: "Diskontsatz muss über der ewigen Wachstumsrate liegen." };
  const N = a.years;
  const flat = Math.round(N / 2);            // Phase 1: Wachstum bleibt konstant
  let fcf = c.fcf, pv = 0;
  const rows = [];
  for (let i = 1; i <= N; i++) {
    const g = i <= flat
      ? a.g1
      : a.g1 + ((a.gT - a.g1) * (i - flat)) / Math.max(1, N - flat);
    fcf *= 1 + g;
    const disc = fcf / Math.pow(1 + a.wacc, i);
    pv += disc;
    rows.push({ jahr: i, g, fcf, bar: disc });
  }
  let tv;
  if (a.term === "exit" && isNum(c.ebitda)) {
    const eb = c.ebitda * Math.pow(1 + (a.g1 + a.gT) / 2, N);
    tv = eb * a.exitMult;
  } else {
    tv = (fcf * (1 + a.gT)) / (a.wacc - a.gT);
  }
  const pvTv = tv / Math.pow(1 + a.wacc, N);
  const ev = pv + pvTv;
  const value = (ev - c.netDebt) / c.shares;
  return { ok: true, value, ev, pv, pvTv, tvShare: pvTv / ev, rows };
}

/* --- Modell 2: Multiplikatoren (KGV, KUV, EV/EBITDA, KBV) ---------------- */
function blendMult(hist, sect, f) {
  const parts = [hist, sect].filter(isNum);
  if (!parts.length) return null;
  return (parts.reduce((s, v) => s + v, 0) / parts.length) * f;
}
function multiples(c, f = 1) {
  const out = {};
  const epsBase = isNum(c.epsFwd) ? (c.eps + c.epsFwd) / 2 : c.eps;

  const fpe = blendMult(c.hist.pe, c.sect.pe, f);
  out.pe = fpe && epsBase > 0
    ? { ok: true, value: fpe * epsBase, mult: fpe, base: epsBase, unit: "Gewinn je Aktie (Mittel aus laufendem und erwartetem Jahr)" }
    : { ok: false, why: "Kein positiver Gewinn je Aktie." };

  const fps = blendMult(c.hist.ps, c.sect.ps, f);
  out.ps = fps
    ? { ok: true, value: fps * c.sps, mult: fps, base: c.sps, unit: "Umsatz je Aktie" }
    : { ok: false, why: "Keine belastbaren Umsatzmultiplikatoren." };

  const fev = blendMult(c.hist.ev, c.sect.ev, f);
  out.ev = fev && isNum(c.ebitda) && isNum(c.netDebt)
    ? { ok: true, value: (fev * c.ebitda - c.netDebt) / c.shares, mult: fev, base: c.ebitda, unit: "EBITDA (Unternehmenswert abzüglich Nettoschulden)" }
    : { ok: false, why: "EBITDA oder Nettoverschuldung nicht aussagekräftig." };

  const fpb = blendMult(c.hist.pb, c.sect.pb, f);
  out.pb = fpb && c.bvps > 0
    ? { ok: true, value: fpb * c.bvps, mult: fpb, base: c.bvps, unit: "Buchwert je Aktie" }
    : { ok: false, why: "Kein belastbarer Buchwert." };
  return out;
}

/* --- Modell 3: Dividendendiskontierung ----------------------------------- */
function ddm(c, a, dg = 0) {
  if (!c.dps) return { ok: false, why: "Keine Dividende – Modell nicht anwendbar." };
  if (c.divY < 0.02 || c.payout < 0.3)
    return { ok: false, why: "Dividendenstarken Werten vorbehalten (Rendite ab 2 %, Ausschüttung ab 30 %)." };
  const r = clamp(Math.max(a.rf + c.beta * ERP, 0.075), 0.05, 0.2);
  const sustain = isNum(c.roe) && isNum(c.payout) ? c.roe * (1 - c.payout) : c.g.fwd;
  const g = clamp(Math.min(sustain, Math.max(c.g.fwd, 0)) + dg, -0.02, r - 0.02);
  const gT = clamp(Math.min(a.gT, r - 0.03), 0, 0.03);
  let d = c.dps, pv = 0;
  for (let i = 1; i <= 5; i++) { d *= 1 + g; pv += d / Math.pow(1 + r, i); }
  const tv = (d * (1 + gT)) / (r - gT);
  return { ok: true, value: pv + tv / Math.pow(1 + r, 5), r, g, gT };
}

/* --- Modell 4: Graham (Gegenprobe) --------------------------------------- */
function graham(c, a) {
  if (c.g.eps5 < 0)
    return { ok: false, why: "Setzt stabile Gewinne voraus – der Gewinn je Aktie ist zuletzt gefallen." };
  const vals = [];
  if (c.eps > 0 && c.bvps > 0) vals.push(Math.sqrt(22.5 * c.eps * c.bvps));
  if (c.eps > 0) {
    const g = clamp(c.g.fwd * 100, -5, 15);
    vals.push((c.eps * (8.5 + 2 * g) * 4.4) / (a.aaa * 100));
  }
  if (!vals.length) return { ok: false, why: "Negativer Gewinn oder Buchwert." };
  return { ok: true, value: vals.reduce((s, v) => s + v, 0) / vals.length, variants: vals };
}

/* --- Gewichtung & Gesamtbild --------------------------------------------- */
const MODEL_META = {
  dcf: { label: "DCF (Cashflow-Barwert)", w: 0.36 },
  pe: { label: "KGV-Vergleich", w: 0.22 },
  ev: { label: "EV/EBITDA-Vergleich", w: 0.15 },
  ps: { label: "KUV-Vergleich", w: 0.07 },
  pb: { label: "Kurs-Buchwert", w: 0.05 },
  ddm: { label: "Dividendenmodell (zweistufig)", w: 0.1 },
  graham: { label: "Graham-Formel (Gegenprobe)", w: 0.05 },
};
function weightsFor(c) {
  const w = Object.fromEntries(Object.entries(MODEL_META).map(([k, v]) => [k, v.w]));
  if (c.profile === "financial") { w.dcf = 0; w.ev = 0; w.ps = 0; w.pb = 0.32; w.pe = 0.35; w.ddm = 0.33; w.graham = 0; }
  if (c.profile === "cyclical") { w.pe = 0.14; w.ev = 0.2; w.pb = 0.1; w.dcf = 0.3; w.ps = 0.08; w.ddm = 0.1; w.graham = 0.08; }
  if (c.t === "VOW3.DE") w.ev *= 0.5;                       // Captive-Finance verzerrt EV
  if (c.t === "TSLA") { w.pe *= 0.6; w.ps *= 1.4; }         // Gewinn noch klein relativ zur Story
  return w;
}
function runModels(c, a, scen = "base") {
  const s = {
    base: { dg: 0, dw: 0, dgr: 0, f: 1 },
    bull: { dg: 0.03, dw: -0.01, dgr: 0.003, f: 1.2 },
    bear: { dg: -0.03, dw: 0.015, dgr: -0.003, f: 0.8 },
  }[scen];
  const aa = {
    ...a,
    g1: clamp(a.g1 + s.dg, -0.15, 0.4),
    gT: clamp(a.gT + s.dgr, 0, 0.035),
    wacc: clamp(a.wacc + s.dw, 0.035, 0.25),
    exitMult: a.exitMult * s.f,
  };
  const m = multiples(c, s.f);
  const res = {
    dcf: dcf(c, aa),
    pe: m.pe, ev: m.ev, ps: m.ps, pb: m.pb,
    ddm: ddm(c, aa, s.dg / 3),
    graham: graham(c, aa),
  };
  const w0 = weightsFor(c);
  let sum = 0, wsum = 0;
  const used = [];
  for (const k of Object.keys(MODEL_META)) {
    const r = res[k];
    if (r && r.ok && isNum(r.value) && r.value > 0 && w0[k] > 0) {
      sum += r.value * w0[k]; wsum += w0[k];
      used.push({ key: k, ...r, weight: w0[k] });
    }
  }
  const fair = wsum > 0 ? sum / wsum : null;
  used.forEach((u) => (u.weightNorm = u.weight / wsum));
  const vals = used.map((u) => u.value);
  const mean = vals.reduce((s2, v) => s2 + v, 0) / (vals.length || 1);
  const sd = Math.sqrt(vals.reduce((s2, v) => s2 + (v - mean) ** 2, 0) / (vals.length || 1));
  return { fair, used, all: res, sd, spread: mean ? sd / mean : null, assumptions: aa };
}
function valuation(c, a) {
  const base = runModels(c, a, "base");
  const bull = runModels(c, a, "bull");
  const bear = runModels(c, a, "bear");
  const upside = base.fair ? base.fair / c.price - 1 : null;
  return { base, bull, bear, upside };
}

/* --- Sensitivität: DCF über WACC × ewiges Wachstum ------------------------ */
function sensitivity(c, a) {
  const waccs = [-0.015, -0.0075, 0, 0.0075, 0.015].map((d) => round4(a.wacc + d));
  const gs = [-0.01, -0.005, 0, 0.005, 0.01].map((d) => round4(a.gT + d));
  const cells = waccs.map((w) =>
    gs.map((g) => {
      const r = dcf(c, { ...a, wacc: w, gT: g });
      return r.ok ? r.value : null;
    })
  );
  return { waccs, gs, cells };
}

/* --- Altman Z-Score ------------------------------------------------------ */
function altman(c) {
  if (c.profile === "financial")
    return { ok: false, why: "Für Banken und Versicherer nicht aussagekräftig." };
  if (![c.ta, c.tl, c.wc, c.re, c.ebit, c.revenue].every(isNum))
    return { ok: false, why: "Bilanzdaten unvollständig." };
  const mcap = c.price * c.shares;
  const z = 1.2 * (c.wc / c.ta) + 1.4 * (c.re / c.ta) + 3.3 * (c.ebit / c.ta)
    + 0.6 * (mcap / c.tl) + 1.0 * (c.revenue / c.ta);
  const zone = z > 2.99 ? "sicher" : z > 1.81 ? "Grauzone" : "kritisch";
  return { ok: true, z, zone };
}

/* --- Qualitäts- und Risikoprofil ----------------------------------------- */
function quality(c) {
  const netDebtEbitda = isNum(c.netDebt) && isNum(c.ebitda) && c.ebitda > 0 ? c.netDebt / c.ebitda : null;
  const parts = [
    { k: "Kapitalrendite", v: clamp(((isNum(c.roic) ? c.roic : c.roe) / 0.25) * 100, 0, 100), w: 1.2 },
    { k: "Marge", v: clamp((c.om / 0.3) * 100, 0, 100), w: 1 },
    { k: "Wachstum", v: clamp(((c.g.fwd + 0.02) / 0.17) * 100, 0, 100), w: 1 },
    {
      k: "Bilanz", w: 1.1,
      v: netDebtEbitda === null ? clamp((c.equity / c.ta) * 400, 0, 100)
        : clamp(100 - Math.max(0, netDebtEbitda) * 25, 0, 100),
    },
    { k: "Kapitalallokation", v: clamp(((c.buyback + c.divY) / 0.05) * 70 + (c.payout > 0.85 ? -20 : 10), 0, 100), w: 0.8 },
    { k: "Burggraben", v: c.moatScore * 10, w: 1.5 },
  ];
  const wsum = parts.reduce((s, p) => s + p.w, 0);
  const score = parts.reduce((s, p) => s + p.v * p.w, 0) / wsum;
  return { score, parts, netDebtEbitda };
}
function riskProfile(c, z, mom6) {
  const nd = isNum(c.netDebt) && isNum(c.ebitda) && c.ebitda > 0 ? c.netDebt / c.ebitda : null;
  const parts = [
    { k: "Kursschwankung", v: clamp((c.vol / 0.6) * 100, 0, 100), note: `Jahresvolatilität ${pctAbs(c.vol, 0)}` },
    { k: "Marktsensitivität", v: clamp((c.beta / 2.2) * 100, 0, 100), note: `Beta ${de(c.beta, 2)}` },
    { k: "Verschuldung", v: nd === null ? 45 : clamp(nd * 22 + 10, 0, 100), note: nd === null ? "branchenbedingt nicht vergleichbar" : `Nettoschulden / EBITDA ${de(nd, 1)}x` },
    { k: "Bilanzstabilität", v: z.ok ? clamp(100 - (z.z / 6) * 100, 0, 100) : 50, note: z.ok ? `Altman Z ${de(z.z, 2)} (${z.zone})` : "nicht anwendbar" },
    { k: "Klumpenrisiko", v: clamp(c.concentration.length * 22 + (c.moatScore < 6 ? 20 : 0), 0, 100), note: `${c.concentration.length} wesentliche Abhängigkeiten` },
    { k: "Gewinntrend", v: clamp(50 - c.g.eps5 * 120, 0, 100), note: `Gewinn je Aktie 5 Jahre ${pct(c.g.eps5, 0)} p. a.` },
  ];
  const score = parts.reduce((s, p) => s + p.v, 0) / parts.length;
  return { score, parts };
}

/* --- Einordnung, Text, Gegenargumente ------------------------------------ */
function verdictOf(upside, q, r) {
  if (upside === null) return { label: "nicht bewertbar", tone: "fair", short: "Datenlage reicht nicht." };
  if (upside > 0.25 && q < 50) return { label: "optisch günstig, mit Qualitätsvorbehalt", tone: "fair", short: "Abschlag könnte begründet sein." };
  if (upside > 0.25) return { label: "attraktiv bewertet", tone: "cheap", short: "Deutlicher Abstand zum Modellwert." };
  if (upside > 0.1) return { label: "leicht unterbewertet", tone: "cheap", short: "Moderater Abschlag." };
  if (upside > -0.1) return { label: "fair bewertet", tone: "fair", short: "Kurs nahe am Modellwert." };
  if (upside > -0.25) return { label: "leicht überbewertet", tone: "rich", short: "Aufschlag zum Modellwert." };
  return { label: "deutlich überbewertet", tone: "rich", short: "Hohe Erwartungen sind eingepreist." };
}
function horizonView(c, upside, q, r, mom6) {
  const kurz = mom6 < -0.1 && upside > 0.1
    ? "Kurzfristig belastet der schwache Kurstrend; ein Abschlag allein dreht ihn nicht."
    : mom6 > 0.2 && upside < -0.1
      ? "Kurzfristig trägt das Momentum, die Bewertung liefert dafür aber keinen Rückhalt mehr."
      : "Kurzfristig dominieren Nachrichtenlage und Zinsen, nicht der Modellwert.";
  const lang = q > 65 && upside > 0
    ? "Langfristig spricht die Kombination aus Geschäftsqualität und Abschlag für den Wert."
    : q > 65
      ? "Langfristig ist die Geschäftsqualität das Argument – bezahlt wird sie aktuell auch."
      : "Langfristig fehlt der Qualitätspuffer, der einen Bewertungsirrtum ausgleichen würde.";
  return { kurz, lang };
}
function narrative(c, v, q, r, z, mom6, a) {
  const up = v.upside;
  const s = [];
  const dir = up > 0.1 ? "unter" : up < -0.1 ? "über" : "nahe";
  s.push(
    `Der gewichtete Modellwert liegt bei ${money(v.base.fair, c.cur)} je Aktie, der Kurs bei ${money(c.price, c.cur)}. Damit notiert ${c.name} ${dir} dem, was die Modelle unter den eingestellten Annahmen rechtfertigen (${pct(up)}).`
  );
  const peNow = c.eps > 0 ? c.price / c.eps : null;
  if (peNow && isNum(c.hist.pe)) {
    const rel = peNow / c.hist.pe - 1;
    s.push(
      `Das KGV von ${de(peNow, 1)} liegt ${Math.abs(rel) < 0.07 ? "etwa auf" : rel > 0 ? `${pctAbs(rel, 0)} über` : `${pctAbs(-rel, 0)} unter`} dem eigenen Fünfjahres-Median von ${de(c.hist.pe, 1)}${isNum(c.sect.pe) ? `, der Sektor kommt auf rund ${de(c.sect.pe, 1)}` : ""}.`
    );
  }
  s.push(
    q.score > 65
      ? `Getragen wird die Bewertung von der Geschäftsqualität: ${pctAbs(isNum(c.roic) ? c.roic : c.roe, 0)} Kapitalrendite, ${pctAbs(c.om, 0)} operative Marge und ein Burggraben, der ${c.moatScore >= 8 ? "breit" : "belastbar"} ist.`
      : `Die Geschäftsqualität stützt nur begrenzt: ${pctAbs(c.om, 0)} operative Marge, Kapitalrendite von ${pctAbs(isNum(c.roic) ? c.roic : c.roe, 0)} und ein eher schmaler Burggraben.`
  );
  if (q.netDebtEbitda !== null) {
    s.push(
      q.netDebtEbitda < 1
        ? `Die Bilanz ist entspannt (Nettoschulden ${de(q.netDebtEbitda, 1)}x EBITDA) und gibt Spielraum für Rückschläge.`
        : `Die Verschuldung von ${de(q.netDebtEbitda, 1)}x EBITDA${z.ok ? ` bei einem Altman-Z-Score von ${de(z.z, 2)} (${z.zone})` : ""} begrenzt den Spielraum in schwachen Jahren.`
    );
  }
  s.push(
    `Ein wesentlicher Teil des DCF-Werts steckt im Endwert nach Jahr ${a.years} – das Ergebnis reagiert daher empfindlich auf Diskontsatz (${pctAbs(a.wacc)}) und ewiges Wachstum (${pctAbs(a.gT)}).`
  );
  return s.join(" ");
}
function counterpoints(c, v, q, r, z) {
  const out = [];
  const dcfr = v.base.all.dcf;
  if (dcfr.ok && dcfr.tvShare > 0.7)
    out.push(`${pctAbs(dcfr.tvShare, 0)} des DCF-Werts stammen aus dem Endwert – also aus Annahmen für die Zeit nach dem Prognosezeitraum.`);
  if (v.base.spread && v.base.spread > 0.3)
    out.push(`Die Modelle liegen weit auseinander (Streuung ${pctAbs(v.base.spread, 0)}). Ein einzelner Modellwert wäre hier eine Scheingenauigkeit.`);
  if (c.g.eps5 < 0)
    out.push("Der Gewinn je Aktie ist über fünf Jahre gefallen. Ein niedriges KGV kann dann eher Warnsignal als Chance sein.");
  if (c.payout > 0.8)
    out.push(`Die Ausschüttungsquote von ${pctAbs(c.payout, 0)} lässt wenig Puffer für schwächere Jahre.`);
  if (c.vol > 0.4)
    out.push(`Bei ${pctAbs(c.vol, 0)} Jahresvolatilität sind zwischenzeitliche Kursverluste von 30 % und mehr normal, nicht außergewöhnlich.`);
  if (z.ok && z.z < 2.99)
    out.push(`Der Altman-Z-Score von ${de(z.z, 2)} liegt in der ${z.zone}.`);
  if (c.sect.pe && c.eps > 0 && c.price / c.eps > c.sect.pe * 1.5)
    out.push("Der Bewertungsaufschlag zum Sektor ist groß – er unterstellt, dass die Sonderstellung dauerhaft ist.");
  if (v.upside > 0.15 && q.score < 60)
    out.push("Ein Abschlag bei schwacher Geschäftsqualität ist oft kein Fehler des Marktes, sondern seine Antwort auf sinkende Erträge.");
  if (c.moatScore < 7)
    out.push(`Der Burggraben ist mit ${c.moatScore} von 10 eher schmal – Wettbewerber können Margen schneller angreifen, als es die Modelle unterstellen.`);
  if (c.concentration[0]) out.push(`Klumpenrisiko: ${c.concentration[0]}.`);
  (c.risks || []).slice(0, 2).forEach((x) => out.push(x + "."));
  c.flags.forEach((f) => out.push(f));
  if (!out.length) out.push("Kein einzelner Punkt sticht heraus – das ersetzt keine eigene Prüfung der Quartalszahlen.");
  return out.slice(0, 6);
}

/* --- Short-Radar (nur Kontext, keine Empfehlung) -------------------------- */
function shortRadar(c, v, q, mom6) {
  const over = v.upside === null ? 0 : clamp(-v.upside * 120, 0, 45);
  const trend = clamp(-mom6 * 100, 0, 25);
  const qual = clamp((60 - q.score) * 0.5, 0, 20);
  const earn = clamp(-c.g.eps5 * 60, 0, 10);
  const score = clamp(over + trend + qual + earn, 0, 100);
  return {
    score,
    parts: [
      { k: "Bewertungsaufschlag", v: over, max: 45 },
      { k: "Negativer Kurstrend (6 M)", v: trend, max: 25 },
      { k: "Schwache Geschäftsqualität", v: qual, max: 20 },
      { k: "Fallender Gewinn", v: earn, max: 10 },
    ],
    squeeze: c.shortInt > 0.02,
  };
}

        {u && <div className="tag dn" style={{ right: 0, left: "auto", transform: "none" }}>{money(u, c.cur, 0)}</div>}
      </div>

      <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", marginTop: 22 }}>
        <span className="kb-pill" style={{ color: TONE[verdict.tone], borderColor: TONE[verdict.tone] }}>
          {verdict.label}
        </span>
        <span className="num" style={{ color: TONE[verdict.tone], fontSize: 15 }}>
          {pct(v.upside)} zum Modellwert
        </span>
        <span className="kb-note">Streuung der Modelle ±{pctAbs(v.base.spread || 0, 0)}</span>
        {custom && <span className="kb-pill">eigener Kurs</span>}
      </div>
      {c.flags.length > 0 && (
        <div className="kb-info" style={{ marginTop: 12 }}>
          {c.flags.map((f2, i) => <div key={i} style={{ marginBottom: i < c.flags.length - 1 ? 6 : 0 }}>{f2}</div>)}
        </div>
      )}
    </Panel>
  );
}

/* --- Chart mit eingezeichnetem Fair-Value-Band ---------------------------- */
const TV_SYMBOL = {
  "AAPL": "NASDAQ:AAPL", "MSFT": "NASDAQ:MSFT", "NVDA": "NASDAQ:NVDA",
  "GOOGL": "NASDAQ:GOOGL", "AMZN": "NASDAQ:AMZN", "TSLA": "NASDAQ:TSLA",
  "KO": "NYSE:KO", "JNJ": "NYSE:JNJ", "PFE": "NYSE:PFE",
  "SAP": "XETR:SAP", "ASML": "EURONEXT:ASML", "ALV.DE": "XETR:ALV", "VOW3.DE": "XETR:VOW3",
};

// iframe-Einbettung statt tv.js: funktioniert auch, wenn die Datei direkt
// vom Dateisystem geoeffnet wird (file://), wo Skript-Widgets scheitern.
function tvUrl(sym, interval, studies) {
  const p = new URLSearchParams({
    symbol: sym, interval: interval, theme: "dark", style: "1",
    locale: "de_DE", timezone: "Europe/Berlin", withdateranges: "1",
    hide_side_toolbar: "0", allow_symbol_change: "0", save_image: "0",
    backgroundColor: "#131316", gridColor: "#2A2A2E", hideideas: "1",
  });
  studies.forEach((st) => p.append("studies", st));
  return "https://s.tradingview.com/widgetembed/?" + p.toString();
}

const EMA_SETS = [
  { key: "trend", label: "EMA 20 / 50 / 200", studies: [
      "STD;EMA%1FEMA%1F20", "STD;EMA%1FEMA%1F50", "STD;EMA%1FEMA%1F200"] },
  { key: "momentum", label: "EMA + RSI", studies: [
      "STD;EMA%1FEMA%1F20", "STD;EMA%1FEMA%1F50", "STD;RSI"] },
  { key: "clean", label: "nur Kurs", studies: [] },
];
const INTERVALS = [["D", "Tag"], ["W", "Woche"], ["60", "1 Std."]];

function Chart({ c, v, series }) {
  const [iv, setIv] = useState("D");
  const [set, setSet] = useState("trend");
  const sym = TV_SYMBOL[c.t];
  const cfg = EMA_SETS.find((x) => x.key === set) || EMA_SETS[0];

  return (
    <Panel title="Kursverlauf" sub="Live-Chart von TradingView mit echten Kursdaten. Je nach Boerse in Echtzeit oder verzoegert.">
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
        {INTERVALS.map(([k, lab]) => (
          <button key={k} className="kb-btn" data-on={iv === k ? "1" : "0"} onClick={() => setIv(k)}>{lab}</button>
        ))}
        <span style={{ flex: 1 }} />
        {EMA_SETS.map((x) => (
          <button key={x.key} className="kb-btn" data-on={set === x.key ? "1" : "0"} onClick={() => setSet(x.key)}>
            {x.label}
          </button>
        ))}
      </div>
      {sym ? (
        <iframe
          key={sym + iv + set}
          title={"Chart " + c.t}
          src={tvUrl(sym, iv, cfg.studies)}
          style={{ width: "100%", height: 420, border: "1px solid var(--line)", borderRadius: 12, background: "var(--panel2)" }}
          allowtransparency="true" scrolling="no" frameBorder="0"
        />
      ) : (
        <div className="kb-info">Fuer diesen Wert ist kein Boersensymbol hinterlegt.</div>
      )}
      <div className="kb-note" style={{ marginTop: 8 }}>
        Laedt der Chart nicht, fehlt die Internetverbindung oder ein Blocker verhindert tradingview.com.
        Die Bewertung unten funktioniert davon unabhaengig.
      </div>

      <div className="kb-rule" />
      <h3 className="kb-h">Fair-Value-Band zum Vergleich</h3>
      <div className="kb-sub">Der Chart zeigt den echten Kurs, die Modellwerte stehen hier daneben.</div>
      <Row lbl="Worst Case" tone="var(--rich)">{money(v.bear.fair, c.cur)}</Row>
      <Row lbl="Gewichteter Modellwert">{money(v.base.fair, c.cur)}</Row>
      <Row lbl="Best Case" tone="var(--cheap)">{money(v.bull.fair, c.cur)}</Row>
      <Row lbl="Eingetragener Kurs" tone={TONE[toneFor(v.upside)]}>
        {money(c.price, c.cur)} ({pct(v.upside, 0)})
      </Row>
      <div className="kb-note" style={{ marginTop: 10 }}>
        Die gleitenden Durchschnitte im Chart beschreiben, wo der Kurs zuletzt lag - sie sagen nichts
        darueber, wo er als naechstes hingeht. Sie sind eine Beschreibung der Vergangenheit, kein Signal.
      </div>
    </Panel>
  );
}

/* --- Annahmen-Regler ------------------------------------------------------ */
function Assumptions({ c, a, set }) {
  const sug = suggestedWacc(c, a.rf);
  return (
    <Panel title="Annahmen" sub="Jede Änderung rechnet alle Modelle sofort neu. Nichts hier ist eine Blackbox.">
      <Slider label="Risikofreier Zins (Makro-Umfeld)" value={a.rf} min={0.005} max={0.07} step={0.001}
        format={(x) => pctAbs(x, 2)}
        hint="Leitet den vorgeschlagenen Diskontsatz ab und wirkt auf jede Barwertrechnung."
        onChange={(x) => set({ ...a, rf: x, wacc: a.waccManual ? a.wacc : suggestedWacc(c, x), aaa: round4(x + 0.012) })} />
      <Slider label="Diskontsatz (WACC)" value={a.wacc} min={0.04} max={0.18} step={0.0025}
        format={(x) => pctAbs(x, 2)}
        hint={`Vorschlag aus Zins und Beta ${de(c.beta, 2)}: ${pctAbs(sug, 2)}.`}
        onChange={(x) => set({ ...a, wacc: x, waccManual: true })} />
      <Slider label="Wachstum Jahr 1 (läuft bis Endjahr aus)" value={a.g1} min={-0.1} max={0.35} step={0.005}
        format={(x) => pct(x, 1)}
        hint={`Analystenschätzung für die nächsten Jahre: ${pct(c.g.fwd, 0)} p. a.`}
        onChange={(x) => set({ ...a, g1: x })} />
      <Slider label="Ewiges Wachstum" value={a.gT} min={0} max={0.035} step={0.0025}
        format={(x) => pctAbs(x, 2)} hint="Auf Dauer kann kein Unternehmen schneller wachsen als die Wirtschaft."
        onChange={(x) => set({ ...a, gT: x })} />
      <Slider label="Prognosezeitraum" value={a.years} min={5} max={15} step={1}
        format={(x) => `${x} Jahre`} hint="Längerer Zeitraum verschiebt Gewicht vom Endwert in die Detailplanung."
        onChange={(x) => set({ ...a, years: x })} />
      <div style={{ display: "flex", gap: 8, margin: "12px 0 4px", flexWrap: "wrap" }}>
        <button className="kb-btn" data-on={a.term === "gordon" ? "1" : "0"} onClick={() => set({ ...a, term: "gordon" })}>
          Endwert: ewiges Wachstum
        </button>
        <button className="kb-btn" data-on={a.term === "exit" ? "1" : "0"} onClick={() => set({ ...a, term: "exit" })}>
          Endwert: Exit-Multiplikator
        </button>
        <button className="kb-btn" onClick={() => set(defaultAssumptions(c))}>Zurücksetzen</button>
      </div>
      {a.term === "exit" && (
        <Slider label="Exit-Multiplikator auf EBITDA" value={a.exitMult} min={4} max={30} step={0.5}
          format={(x) => `${de(x, 1)}x`} hint="Alternative zum ewigen Wachstum: Verkaufswert am Ende des Zeitraums."
          onChange={(x) => set({ ...a, exitMult: x })} />
      )}
    </Panel>
  );
}

/* --- Modelle im Einzelnen ------------------------------------------------- */
function Models({ c, v }) {
  const rows = Object.keys(MODEL_META).map((k) => {
    const r = v.base.all[k];
    const used = v.base.used.find((u) => u.key === k);
    return { k, meta: MODEL_META[k], r, used };
  });
  const d = v.base.all.dcf;
  return (
    <Panel title="Die Modelle einzeln" sub="Gewichtet wird nur, was für dieses Geschäftsmodell trägt.">
      <div className="kb-scroll">
        <table className="kb-tbl">
          <thead>
            <tr><th>Modell</th><th>Wert je Aktie</th><th>Abweichung</th><th>Gewicht</th></tr>
          </thead>
          <tbody>
            {rows.map(({ k, meta, r, used }) => {
              const up = r && r.ok ? r.value / c.price - 1 : null;
              return (
                <tr key={k}>
                  <td>
                    <div>{meta.label}</div>
                    {(!r || !r.ok) && <div className="kb-note">{r ? r.why : "nicht verfügbar"}</div>}
                    {r && r.ok && r.mult && (
                      <div className="kb-note">{de(r.mult, 1)}x auf {r.unit}</div>
                    )}
                    {k === "ddm" && r.ok && (
                      <div className="kb-note">Eigenkapitalkosten {pctAbs(r.r)}, Dividendenwachstum {pctAbs(r.g)}</div>
                    )}
                  </td>
                  <td>{r && r.ok ? money(r.value, c.cur) : "–"}</td>
                  <td style={{ color: up === null ? "var(--faint)" : TONE[toneFor(up)] }}>{up === null ? "–" : pct(up, 0)}</td>
                  <td>{used ? pctAbs(used.weightNorm, 0) : "0 %"}</td>
                </tr>
              );
            })}
            <tr>
              <td style={{ fontWeight: 600 }}>Gewichteter Modellwert</td>
              <td style={{ fontWeight: 600 }}>{money(v.base.fair, c.cur)}</td>
              <td style={{ fontWeight: 600, color: TONE[toneFor(v.upside)] }}>{pct(v.upside, 0)}</td>
              <td>100 %</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div className="kb-rule" />
      <h3 className="kb-h">Szenarien</h3>
      <div className="kb-sub">Best und Worst Case verschieben Wachstum, Diskontsatz und Multiplikatoren gemeinsam – nicht nur eine Stellschraube.</div>
      <Row lbl="Worst Case (Wachstum −3 Pp., WACC +1,5 Pp., Multiplikatoren −20 %)" tone="var(--rich)">{money(v.bear.fair, c.cur)}</Row>
      <Row lbl="Base Case (Ihre Annahmen)">{money(v.base.fair, c.cur)}</Row>
      <Row lbl="Best Case (Wachstum +3 Pp., WACC −1 Pp., Multiplikatoren +20 %)" tone="var(--cheap)">{money(v.bull.fair, c.cur)}</Row>
      <div className="kb-note" style={{ marginTop: 8 }}>
        Streuung der Einzelmodelle im Base Case: ±{money(v.base.sd, c.cur)} ({pctAbs(v.base.spread || 0, 0)}).
        Das ist ein Maß für Modellunsicherheit, kein statistisches Konfidenzintervall – es sagt, wie einig sich die Verfahren sind.
      </div>

      {d.ok && (
        <>
          <div className="kb-rule" />
          <h3 className="kb-h">Woraus der DCF-Wert besteht</h3>
          <div className="kb-sub">Je größer der Endwert-Anteil, desto mehr hängt das Ergebnis an Annahmen statt an Planzahlen.</div>
          <Row lbl="Barwert der Planjahre">{big(d.pv, c.cur)}</Row>
          <Row lbl="Barwert des Endwerts">{big(d.pvTv, c.cur)}</Row>
          <Row lbl="Anteil Endwert am Unternehmenswert">{pctAbs(d.tvShare, 0)}</Row>
          <Row lbl="Unternehmenswert">{big(d.ev, c.cur)}</Row>
          <Row lbl="abzüglich Nettoschulden">{big(-c.netDebt, c.cur)}</Row>
          <Row lbl="Eigenkapitalwert je Aktie">{money(d.value, c.cur)}</Row>
        </>
      )}
    </Panel>
  );
}

/* --- Einordnung: Skala, eigene Historie, Peers, Makro --------------------- */
function Context({ c, v, a, series }) {
  const dev = clamp(v.upside ?? 0, -1, 1);
  const pos = ((clamp(dev, -0.5, 0.5) + 0.5) / 1) * 100;
  const peNow = c.eps > 0 ? c.price / c.eps : null;
  const peers = c.peers.map((p) => BY_TICKER[p]).filter(Boolean);
  const rfUp = { ...a, rf: a.rf + 0.01, wacc: a.wacc + 0.01, aaa: a.aaa + 0.01 };
  const vRf = valuation(c, rfUp);
  const mom6 = momentum(series, 6);

  return (
    <Panel title="Einordnung" sub="Billig oder teuer ist immer relativ – zur eigenen Historie, zum Sektor und zum Zinsumfeld.">
      <div style={{ position: "relative", height: 46, margin: "6px 0 18px" }}>
        <div style={{
          position: "absolute", top: 16, left: 0, right: 0, height: 8, borderRadius: 4,
          background: "linear-gradient(90deg,var(--rich),rgba(255,255,255,.35),var(--cheap))", opacity: 0.9,
        }} />
        <div style={{ position: "absolute", top: 8, left: `${pos}%`, width: 2, height: 24, background: "var(--ink)" }} />
        <div style={{ position: "absolute", top: 32, left: `${pos}%`, transform: "translateX(-50%)", fontSize: 11, whiteSpace: "nowrap" }}>
          {pct(v.upside, 0)}
        </div>
        <div className="kb-note" style={{ position: "absolute", top: 0, left: 0 }}>−50 % teuer</div>
        <div className="kb-note" style={{ position: "absolute", top: 0, right: 0 }}>+50 % günstig</div>
      </div>

      <h3 className="kb-h">Gegen die eigene Historie</h3>
      <div className="kb-sub">Aktueller Multiplikator gegen den Fünfjahres-Median des Unternehmens.</div>
      {peNow && isNum(c.hist.pe) && (
        <Row lbl={`KGV heute ${de(peNow, 1)} · Median ${de(c.hist.pe, 1)}`} tone={TONE[toneFor(c.hist.pe / peNow - 1)]}>
          {pct(peNow / c.hist.pe - 1, 0)}
        </Row>
      )}
      {isNum(c.hist.ps) && (
        <Row lbl={`KUV heute ${de(c.price / c.sps, 1)} · Median ${de(c.hist.ps, 1)}`} tone={TONE[toneFor(c.hist.ps / (c.price / c.sps) - 1)]}>
          {pct((c.price / c.sps) / c.hist.ps - 1, 0)}
        </Row>
      )}
      {isNum(c.hist.pb) && (
        <Row lbl={`KBV heute ${de(c.price / c.bvps, 1)} · Median ${de(c.hist.pb, 1)}`} tone={TONE[toneFor(c.hist.pb / (c.price / c.bvps) - 1)]}>
          {pct((c.price / c.bvps) / c.hist.pb - 1, 0)}
        </Row>
      )}

      <div className="kb-rule" />
      <h3 className="kb-h">Gegen Sektor und Wettbewerber</h3>
      <div className="kb-scroll" style={{ marginTop: 8 }}>
        <table className="kb-tbl">
          <thead><tr><th>Wert</th><th>KGV</th><th>EV/EBITDA</th><th>Op. Marge</th><th>Kapitalrendite</th></tr></thead>
          <tbody>
            <tr>
              <td style={{ color: "var(--accent)" }}>{c.t}</td>
              <td>{peNow ? de(peNow, 1) : "–"}</td>
              <td>{isNum(c.ebitda) && isNum(c.netDebt) ? de((c.price * c.shares + c.netDebt) / c.ebitda, 1) : "–"}</td>
              <td>{pctAbs(c.om, 0)}</td>
              <td>{pctAbs(isNum(c.roic) ? c.roic : c.roe, 0)}</td>
            </tr>
            {peers.map((p) => (
              <tr key={p.t}>
                <td>{p.t}</td>
                <td>{p.eps > 0 ? de(p.price / p.eps, 1) : "–"}</td>
                <td>{isNum(p.ebitda) && isNum(p.netDebt) ? de((p.price * p.shares + p.netDebt) / p.ebitda, 1) : "–"}</td>
                <td>{pctAbs(p.om, 0)}</td>
                <td>{pctAbs(isNum(p.roic) ? p.roic : p.roe, 0)}</td>
              </tr>
            ))}
            <tr>
              <td style={{ color: "var(--muted)" }}>Sektor</td>
              <td>{isNum(c.sect.pe) ? de(c.sect.pe, 1) : "–"}</td>
              <td>{isNum(c.sect.ev) ? de(c.sect.ev, 1) : "–"}</td>
              <td>–</td><td>–</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div className="kb-rule" />
      <h3 className="kb-h">Zins- und Marktumfeld</h3>
      <div className="kb-sub">Bewertungen sind Barwerte. Steigen die Zinsen, sinkt der Barwert weit entfernter Gewinne.</div>
      <Row lbl="Modellwert bei heutigem Zins">{money(v.base.fair, c.cur)}</Row>
      <Row lbl="bei einem Zins-Anstieg um 1 Prozentpunkt" tone="var(--rich)">
        {money(vRf.base.fair, c.cur)} ({pct((vRf.base.fair ?? 0) / (v.base.fair || 1) - 1, 0)})
      </Row>
      <Row lbl="Kurstrend der letzten 6 Monate" tone={TONE[mom6 > 0 ? "cheap" : "rich"]}>{pct(mom6, 0)}</Row>
      <div className="kb-note" style={{ marginTop: 8 }}>
        Wachstumswerte mit spätem Cashflow reagieren stärker auf Zinsänderungen als Substanzwerte.
        Der Effekt oben zeigt genau diesen Hebel für {c.t}.
      </div>
    </Panel>
  );
}

/* --- Qualität ------------------------------------------------------------- */
function Quality({ c, q }) {
  return (
    <>
      <Panel title="Geschäftsqualität" sub={`Gesamtwert ${Math.round(q.score)} von 100 – gewichtet nach Burggraben, Rendite und Bilanz.`}>
        {q.parts.map((p) => (
          <Meter key={p.k} label={p.k} value={p.v}
            color={p.v > 66 ? "var(--ink)" : p.v > 40 ? "var(--muted)" : "var(--faint)"} />
        ))}
      </Panel>

      <Panel title="Wettbewerbsvorteil">
        <p className="kb-body kb-serif">{c.moat}</p>
        <Row lbl="Burggraben-Einschätzung">{c.moatScore} / 10</Row>
        <Row lbl="Bruttomarge">{pctAbs(c.gm, 0)}</Row>
        <Row lbl="Operative Marge">{pctAbs(c.om, 0)}</Row>
        <Row lbl="Kapitalrendite">{pctAbs(isNum(c.roic) ? c.roic : c.roe, 0)}</Row>
      </Panel>

      <Panel title="Bilanz und Kapitalallokation">
        <p className="kb-body kb-serif">{c.mgmt}</p>
        <Row lbl="Nettoschulden / EBITDA">{q.netDebtEbitda === null ? "nicht vergleichbar" : `${de(q.netDebtEbitda, 1)}x`}</Row>
        <Row lbl="Eigenkapitalquote">{isNum(c.equity) && isNum(c.ta) ? pctAbs(c.equity / c.ta, 0) : "–"}</Row>
        <Row lbl="Dividendenrendite">{pctAbs(c.divY, 2)}</Row>
        <Row lbl="Ausschüttungsquote">{pctAbs(c.payout, 0)}</Row>
        <Row lbl="Rückkaufrendite">{pctAbs(c.buyback, 1)}</Row>
        <Row lbl="Gesamte Aktionärsrendite">{pctAbs(c.divY + c.buyback, 1)}</Row>
      </Panel>

      <Panel title="Wachstum und Zyklus">
        <Row lbl="Umsatzwachstum 5 Jahre p. a.">{pct(c.g.rev5, 0)}</Row>
        <Row lbl="Gewinnwachstum 5 Jahre p. a." tone={c.g.eps5 < 0 ? "var(--rich)" : "inherit"}>{pct(c.g.eps5, 0)}</Row>
        <Row lbl="Analystenschätzung nächste Jahre">{pct(c.g.fwd, 0)}</Row>
        <Row lbl="Zyklik des Geschäftsmodells">
          {c.profile === "cyclical" ? "ausgeprägt" : c.profile === "financial" ? "zins- und schadenabhängig" : "moderat"}
        </Row>
      </Panel>
    </>
  );
}

/* --- Risiko --------------------------------------------------------------- */
function Risk({ c, v, a, r, z }) {
  const sens = useMemo(() => sensitivity(c, a), [c, a]);
  return (
    <>
      <Panel title="Risikoprofil" sub={`Gesamtwert ${Math.round(r.score)} von 100 – höher heißt riskanter, nicht schlechter.`}>
        {r.parts.map((p) => (
          <Meter key={p.k} label={p.k} value={p.v} note={p.note}
            color={p.v > 66 ? "var(--ink)" : p.v > 40 ? "var(--muted)" : "var(--faint)"} />
        ))}
      </Panel>

      <Panel title="Insolvenz- und Bilanzrisiko">
        {z.ok ? (
          <>
            <Row lbl="Altman Z-Score">
              {de(z.z, 2)} · {z.zone}
            </Row>
            <div className="kb-note" style={{ marginTop: 8 }}>
              Über 2,99 gilt als sicher, zwischen 1,81 und 2,99 als Grauzone, darunter als kritisch.
              Der Score wurde für Industrieunternehmen entwickelt; bei kapitalarmen Software- oder
              Plattformgeschäften fällt er systematisch zu hoch aus.
            </div>
          </>
        ) : (
          <div className="kb-info">{z.why}</div>
        )}
      </Panel>

      <Panel title="Klumpenrisiken">
        {c.concentration.map((k, i) => <Row key={i} lbl={k}> </Row>)}
        <div className="kb-rule" />
        <h3 className="kb-h">Wesentliche Einzelrisiken</h3>
        <ul style={{ margin: "10px 0 0", paddingLeft: 18, fontSize: 14, lineHeight: 1.6 }}>
          {c.risks.map((k, i) => <li key={i} style={{ marginBottom: 6 }}>{k}</li>)}
        </ul>
      </Panel>

      <Panel title="Sensitivität des DCF-Werts" sub="Zeilen: Diskontsatz. Spalten: ewiges Wachstum. Farbe: Abweichung vom heutigen Kurs.">
        {sens.cells[0][0] === null ? (
          <div className="kb-info">DCF für dieses Geschäftsmodell nicht anwendbar.</div>
        ) : (
          <div className="kb-scroll">
            <div className="kb-heat" style={{ gridTemplateColumns: `64px repeat(${sens.gs.length},1fr)`, minWidth: 340 }}>
              <div style={{ color: "var(--faint)" }}>WACC \ g</div>
              {sens.gs.map((g) => <div key={g} style={{ color: "var(--faint)" }}>{pctAbs(g, 2)}</div>)}
              {sens.waccs.map((w, i) => (
                <React.Fragment key={w}>
                  <div style={{ color: "var(--faint)" }}>{pctAbs(w, 2)}</div>
                  {sens.cells[i].map((val, j) => (
                    <div key={j} style={{ background: heat(val === null ? null : val / c.price - 1) }}>

function ChatBot({ c, a, v, q, r, z, verdict, seed, onSeedUsed }) {
  const [open, setOpen] = useState(!!seed);
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [busy, setBusy] = useState(false);
  const [stream, setStream] = useState("");
  const [err, setErr] = useState(null);
  const [ready, setReady] = useState("laden");        // laden | ok | aus
  const sampleRef = useRef(null);
  const abortRef = useRef(null);
  const bodyRef = useRef(null);
  const lastTicker = useRef(c.t);

  if (lastTicker.current !== c.t) {
    lastTicker.current = c.t;
    if (messages.length) {
      setMessages((m) => [...m, { role: "sys", content: `Ansicht gewechselt zu ${c.t} — der Assistent bezieht sich ab jetzt auf diesen Wert.` }]);
    }
  }

  React.useEffect(() => {
    let alive = true;
    (async () => {
      try {
        const fn = window.claude && window.claude.use ? await window.claude.use("sample") : null;
        if (!alive) return;
        sampleRef.current = fn;
        setReady(fn ? "ok" : "aus");
      } catch (e) {
        if (alive) setReady("aus");
      }
    })();
    return () => { alive = false; };
  }, []);

  React.useEffect(() => {
    if (bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight;
  }, [messages, stream, busy, open]);

  React.useEffect(() => {
    if (seed && seed.text) {
      setOpen(true);
      send(seed.text);
      if (onSeedUsed) onSeedUsed();
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [seed]);

  async function send(text) {
    const ask = (text ?? input).trim();
    if (!ask || busy) return;
    const fn = sampleRef.current;
    setInput("");
    setErr(null);
    const history = [...messages, { role: "user", content: ask }];
    setMessages(history);
    if (!fn) {
      setErr("Der Assistent ist in dieser Ansicht nicht verfügbar. Öffnen Sie die Seite über den Artifact-Link in Claude.");
      return;
    }
    setBusy(true);
    setStream("");
    const ctl = new AbortController();
    abortRef.current = ctl;
    try {
      const lead = pageInstructions(c, a, v, q, r, z, verdict);
      const turns = [
        { role: "user", content: lead },
        ...history
          .filter((m) => m.role === "user" || m.role === "bot")
          .slice(-8)
          .map((m) => ({ role: m.role === "bot" ? "assistant" : "user", content: m.content })),
      ];
      if (turns[turns.length - 1].role !== "user") turns.push({ role: "user", content: ask });
      const res = await fn(turns, {
        cache: false,
        modelTier: "quick",
        signal: ctl.signal,
        onText: ({ text: t }) => setStream(t),
      });
      setMessages((m) => [...m, { role: "bot", content: res.text }]);
    } catch (e) {
      const code = e && e.code ? e.code : "upstream_error";
      if (code === "cancelled") {
        if (e.text) setMessages((m) => [...m, { role: "bot", content: e.text }, { role: "sys", content: "abgebrochen" }]);
      } else {
        if (e && e.text) setMessages((m) => [...m, { role: "bot", content: e.text }]);
        setErr(SAMPLE_ERRORS[code] || "Unerwarteter Fehler: " + code);
      }
    } finally {
      setStream("");
      setBusy(false);
      abortRef.current = null;
    }
  }

  return (
    <>
      {!open && (
        <button className="kb-chat-fab" onClick={() => setOpen(true)} aria-label="Analyse-Assistenten öffnen">
          💬
        </button>
      )}
      {open && (
        <div className="kb-chat" role="dialog" aria-label={`Analyse-Assistent zu ${c.name}`}>
          <div className="kb-chat-head">
            <div>
              <b>Assistent</b>
              <span>kennt die Zahlen zu {c.t} · beantwortet auch allgemeine Fragen</span>
            </div>
            <button className="kb-chat-close" onClick={() => setOpen(false)} aria-label="Schließen">✕</button>
          </div>
          <div className="kb-chat-body" ref={bodyRef}>
            {ready === "aus" && (
              <div className="kb-msg sys">
                Der Assistent ist hier nicht verfügbar. Er läuft nur, wenn die Seite über den Artifact-Link in Claude geöffnet wird.
              </div>
            )}
            {messages.length === 0 && (
              <div className="kb-chat-empty">
                Fragen Sie, was Sie wollen: zu den berechneten Zahlen für {c.t}, zu Begriffen, zu anderen Unternehmen
                oder einfach zum Verständnis. Tagesaktuelle Kurse und Nachrichten kennt der Assistent nicht.
                <div className="qs">
                  {CHAT_STARTERS.map((sq) => (
                    <button key={sq} className="kb-btn" onClick={() => send(sq)}>{sq}</button>
                  ))}
                </div>
              </div>
            )}
            {messages.map((m, i) => (
              <div key={i} className={"kb-msg " + m.role}>{m.content}</div>
            ))}
            {busy && (
              <div className="kb-msg bot">
                {stream || <div className="kb-typing"><i /><i /><i /></div>}
              </div>
            )}
            {err && <div className="kb-msg sys">{err}</div>}
          </div>
          <div className="kb-chat-foot">
            <textarea
              rows={1}
              placeholder="Frage eingeben…"
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } }}
            />
            {busy ? (
              <button className="kb-chat-send" onClick={() => abortRef.current && abortRef.current.abort()}>Stopp</button>
            ) : (
              <button className="kb-chat-send" onClick={() => send()} disabled={!input.trim() || ready !== "ok"}>Senden</button>
            )}
          </div>
        </div>
      )}
    </>
  );
}

/* --- Merkliste ------------------------------------------------------------ */
function Watchlist({ watch, prices, onOpen, onToggle }) {
  const rows = watch.map((t) => {
    const b = BY_TICKER[t];
    if (!b) return null;
    const c = prices[t] != null ? { ...b, price: prices[t], priceCustom: true } : b;
    const a = defaultAssumptions(c);
    const v = valuation(c, a);
    const q = quality(c);
    const z = altman(c);
    const rp = riskProfile(c, z, 0);
    return { c, v, verdict: verdictOf(v.upside, q.score, rp.score) };
  }).filter(Boolean);

  return (
    <>
      <Panel title="Merkliste" sub={rows.length ? `${rows.length} ${rows.length === 1 ? "Wert" : "Werte"} · tippen zum Öffnen` : "Noch nichts gemerkt."}>
        {rows.length === 0 ? (
          <div className="kb-note" style={{ padding: "6px 0 2px", lineHeight: 1.6 }}>
            Öffnen Sie einen Wert über die Suche und tippen Sie oben auf den Stern. Gemerkte Werte
            erscheinen hier mit Kurs, Modellwert und Einschätzung — und bleiben auch nach dem
            Schließen der Seite in diesem Browser erhalten.
          </div>
        ) : (
          <div className="kb-wl">
            {rows.map(({ c, v, verdict }) => (
              <button key={c.t} onClick={() => onOpen(c.t)}>
                <span
                  className="kb-star" data-on="1" role="button" tabIndex={0}
                  aria-label={`${c.t} aus der Merkliste entfernen`}
                  onClick={(e) => { e.stopPropagation(); onToggle(c.t); }}
                  onKeyDown={(e) => { if (e.key === "Enter") { e.stopPropagation(); onToggle(c.t); } }}
                >★</span>
                <span className="who">
                  <b>{c.t}</b>
                  <small>{c.name}{c.priceCustom ? " · eigener Kurs" : ""}</small>
                </span>
                <span className="fig">
                  <b>{money(c.price, c.cur, 2)}</b>
                  <small style={{ color: TONE[verdict.tone] }}>{pct(v.upside, 0)}</small>
                </span>
              </button>
            ))}
          </div>
        )}
      </Panel>

      {rows.length > 1 && (
        <Panel title="Alle gemerkten Werte im Überblick" sub="Mit den Standardannahmen des jeweiligen Wertes gerechnet.">
          <div className="kb-scroll">
            <table className="kb-tbl">
              <thead>
                <tr><th>Wert</th><th>Kurs</th><th>Modellwert</th><th>Abweichung</th><th>Einschätzung</th></tr>
              </thead>
              <tbody>
                {rows.map(({ c, v, verdict }) => (
                  <tr key={c.t}>
                    <td>{c.t}</td>
                    <td>{money(c.price, c.cur, 0)}</td>
                    <td>{money(v.base.fair, c.cur, 0)}</td>
                    <td style={{ color: TONE[verdict.tone] }}>{pct(v.upside, 0)}</td>
                    <td style={{ textAlign: "right", color: TONE[verdict.tone] }}>{verdict.label}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Panel>
      )}
    </>
  );
}

  const hits = q
    ? GLOSSARY.filter((g) => (g.t + " " + g.d + " " + (g.r || "")).toLowerCase().includes(q))
    : GLOSSARY;
  const cats = [];
  hits.forEach((g) => { if (!cats.includes(g.k)) cats.push(g.k); });
  return (
    <Panel title="Handbuch" sub={`Jeder Begriff dieser Seite, in einfachen Worten. ${GLOSSARY.length} Einträge.`}>
      <input
        className="kb-hb-search"
        value={find}
        onChange={(e) => setFind(e.target.value)}
        placeholder="Begriff suchen, etwa „KGV“ oder „Burggraben“"
        style={{
          width: "100%", background: "var(--panel2)", border: "1px solid var(--line)",
          color: "var(--ink)", borderRadius: 14, padding: "12px 14px", fontSize: 14.5, outline: "none",
        }}
      />
      {hits.length === 0 && (
        <div className="kb-gl-empty">Kein Eintrag gefunden. Fragen Sie den Assistenten unten rechts — er erklärt auch Begriffe, die hier fehlen.</div>
      )}
      {cats.map((cat) => (
        <div key={cat}>
          <div className="kb-gl-cat">{cat}</div>
          {hits.filter((g) => g.k === cat).map((g) => (
            <div className="kb-gl-item" key={g.t}>
              <b>{g.t}</b>
              <p>{g.d}</p>
              {g.r && <div className="rule">Faustregel: {g.r}</div>}
            </div>
          ))}
        </div>
      ))}
    </Panel>
  );
}

/* ============================================================================
   Anwendung
   ========================================================================== */
const TABS = [
  ["bewertung", "Bewertung"],
  ["qualitaet", "Qualität"],
  ["risiko", "Risiko"],
  ["optionen", "Optionen"],
  ["fazit", "Fazit"],
  ["merkliste", "Merkliste"],
  ["vergleich", "Vergleich"],
  ["handbuch", "Handbuch"],
  ["daten", "Daten"],
];

function App() {
  const [ticker, setTicker] = useState("AAPL");
  const [a, setA] = useState(() => defaultAssumptions(BY_TICKER.AAPL));
  const [tab, setTab] = useState("bewertung");
  const [query, setQuery] = useState("");
  const [open, setOpen] = useState(false);
  const [picks, setPicks] = useState(["AAPL", "MSFT", "KO"]);
  const [chatSeed, setChatSeed] = useState(null);
  const boxRef = useRef(null);

  const load = loadCompany(ticker);
  const base = load.data;
  const [prices, setPrices] = useState(() => {       // vom Nutzer eingetragene Kurse je Ticker
    try { return JSON.parse(localStorage.getItem("tra_prices") || "{}"); } catch (e) { return {}; }
  });
  const [watch, setWatch] = useState(() => {
    try { return JSON.parse(localStorage.getItem("tra_watch") || "[]"); } catch (e) { return []; }
  });
  React.useEffect(() => {
    try { localStorage.setItem("tra_prices", JSON.stringify(prices)); } catch (e) {}
  }, [prices]);
  React.useEffect(() => {
    try { localStorage.setItem("tra_watch", JSON.stringify(watch)); } catch (e) {}
  }, [watch]);
  const toggleWatch = (t) =>
    setWatch((w) => (w.includes(t) ? w.filter((x) => x !== t) : [...w, t]));
  const custom = prices[base.t] != null;
  const c = useMemo(
    () => (custom ? { ...base, price: prices[base.t], priceCustom: true } : base),
    [base, prices, custom]
  );
  const setPrice = (val) =>
    setPrices((p) => {
      const next = { ...p };
      if (val == null) delete next[base.t]; else next[base.t] = val;
      return next;
    });

  const series = useMemo(() => priceSeries(c), [c]);
  const mom6 = useMemo(() => momentum(series, 6), [series]);
  const v = useMemo(() => valuation(c, a), [c, a]);
  const qual = useMemo(() => quality(c), [c]);
  const z = useMemo(() => altman(c), [c]);
  const rp = useMemo(() => riskProfile(c, z, mom6), [c, z, mom6]);
  const verdict = useMemo(() => verdictOf(v.upside, qual.score, rp.score), [v, qual, rp]);
  const radar = useMemo(() => shortRadar(c, v, qual, mom6), [c, v, qual, mom6]);

  const hits = query.trim()
    ? COMPANIES.filter((x) =>
        (x.t + " " + x.name + " " + x.sector).toLowerCase().includes(query.trim().toLowerCase())
      ).slice(0, 6)
    : [];

  function select(t) {
    setTicker(t);
    setA(defaultAssumptions(BY_TICKER[t]));
    setQuery("");
    setOpen(false);
    setTab("bewertung");
    if (boxRef.current) boxRef.current.blur();
  }
  const toggle = (t) =>
    setPicks((p) => (p.includes(t) ? p.filter((x) => x !== t) : p.length >= 4 ? p : [...p, t]));

  return (
    <div className="kb">
      <style>{CSS}</style>

      <div className="kb-top">
        <div className="kb-wrap">
          <div className="kb-brand">
            <b>Trade Republic Analyser</b>
            <span>unabhängiges Projekt, nicht mit der Trade Republic Bank GmbH verbunden · keine Anlageberatung</span>
          </div>
          <div className="kb-search">
            <input
              ref={boxRef}
              value={query}
              placeholder="Ticker oder Firmenname, etwa AAPL oder Allianz"
              onChange={(e) => { setQuery(e.target.value); setOpen(true); }}
              onFocus={() => setOpen(true)}
              onKeyDown={(e) => { if (e.key === "Enter" && hits[0]) select(hits[0].t); if (e.key === "Escape") setOpen(false); }}
            />
            {open && query.trim() && (
              <div className="kb-sug">
                {hits.length > 0 ? (
                  hits.map((x) => (
                    <button key={x.t} onClick={() => select(x.t)}>
                      <span>{x.name}</span>
                      <small>{x.t} · {x.sector}</small>
                    </button>
                  ))
                ) : (
                  <button
                    onClick={() => {
                      setChatSeed({
                        text: `Erzähl mir etwas über "${query.trim()}" — Geschäftsmodell, Ertragstreiber und Risiken. Diese Aktie ist nicht im Datensatz der Seite.`,
                      });
                      setOpen(false);
                    }}
                  >
                    <span>Kein Datensatz gefunden — Assistenten fragen 💬</span>
                    <small>Auskunft zu „{query.trim()}“ aus dem Wissen des Assistenten</small>
                  </button>
                )}
              </div>
            )}
          </div>
          <div className="kb-tabs">
            {TABS.map(([k, label]) => (
              <button key={k} data-on={tab === k ? "1" : "0"} onClick={() => setTab(k)}>{label}</button>
            ))}
          </div>
        </div>
      </div>

      <div className="kb-wrap">
        {tab !== "vergleich" && tab !== "daten" && tab !== "handbuch" && tab !== "merkliste" && (
          <Header c={c} v={v} verdict={verdict} onPrice={setPrice} custom={custom}
            watched={watch.includes(base.t)} onWatch={() => toggleWatch(base.t)} />
        )}

        {tab === "bewertung" && (
          <>
            <Chart c={c} v={v} series={series} />
            <Assumptions c={c} a={a} set={setA} />
            <Models c={c} v={v} />
            <Context c={c} v={v} a={a} series={series} />
          </>
        )}
        {tab === "qualitaet" && <Quality c={c} q={qual} />}
        {tab === "risiko" && <Risk c={c} v={v} a={a} r={rp} z={z} />}
        {tab === "optionen" && <Options c={c} a={a} radar={radar} mom6={mom6} />}
        {tab === "fazit" && (
          <Conclusion c={c} v={v} q={qual} r={rp} z={z} verdict={verdict} mom6={mom6} a={a} />
        )}
        {tab === "merkliste" && (
          <Watchlist watch={watch} prices={prices} onToggle={toggleWatch}
            onOpen={(t) => { select(t); }} />
        )}
        {tab === "vergleich" && <Compare picks={picks} toggle={toggle} />}
        {tab === "handbuch" && <Handbook />}
        {tab === "daten" && <DataTab c={c} />}

        <div className="kb-foot">
          Unabhängiges, privates Projekt ohne Verbindung zur Trade Republic Bank GmbH; der Name wird nur beschreibend verwendet.
          Keine Anlageberatung. Alle Angaben ohne Gewähr, Kurse nicht in Echtzeit (im Live-Betrieb typisch
          15 Minuten verzögert). Modellwerte hängen vollständig von den eingestellten Annahmen ab und sind keine
          Prognose. Wertpapiere können bis zum Totalverlust fallen; Leerverkäufe können darüber hinaus zu
          Verlusten führen, die den Einsatz übersteigen. Sie entscheiden selbst und tragen das Risiko allein.
        </div>
      </div>

      <ChatBot c={c} a={a} v={v} q={qual} r={rp} z={z} verdict={verdict}
        seed={chatSeed} onSeedUsed={() => setChatSeed(null)} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>

<script>
(function () {
  function load(urls, cb) {
    var i = 0;
    (function next() {
      if (i >= urls.length) return fail("Bibliothek nicht erreichbar: " + urls[0]);
      var s = document.createElement("script");
      s.src = urls[i++]; s.onload = cb; s.onerror = next;
      document.head.appendChild(s);
    })();
  }
  function soft(url, cb) {           // optional: fehlt er, läuft die Seite trotzdem
    var s = document.createElement("script");
    s.src = url; s.onload = cb; s.onerror = function () { cb(); };
    document.head.appendChild(s);
  }
  function fail(msg) {
    document.getElementById("root").innerHTML =
      '<div id="boot"><b>Laden fehlgeschlagen</b>' + msg +
      '<br><br>Diese Datei braucht beim Öffnen eine Internetverbindung.</div>';
  }
  var R = ["https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js",
           "https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"];
  var D = ["https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js",
           "https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"];
  var B = ["https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.3/babel.min.js",
           "https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.3/babel.min.js"];
  load(R, function () { load(D, function () { load(B, function () {
    soft("https://s3.tradingview.com/tv.js", function () {
      try {
        var code = Babel.transform(document.getElementById("app-src").textContent,
          { presets: [["react", { runtime: "classic" }]] }).code;
        var s = document.createElement("script");
        s.textContent = code;
        document.body.appendChild(s);
      } catch (e) { fail("Fehler beim Übersetzen: " + e.message); }
    });
  }); }); });
})();
</script>
</body>
</html>
